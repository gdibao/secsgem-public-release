name: ComHub Build Images
run-name: ComHub Build Images (${{ github.ref_name }} @ ${{ github.sha }})

on:
  push:
    branches:
      - main
      - upgrade/upstream-v2.2.6-comhub-merge
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional extra image tag, for example 20260527-001'
        required: false
        type: string
      use_cn_mirror:
        description: 'Use China npm/apt mirrors during Docker build'
        required: true
        default: 'true'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: comhub-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NODEJS_VERSION: '24.18.0'

jobs:
  verify-module-app:
    name: Verify Module App Production Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js, pnpm, and Bun
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run required commercial, container, PostgreSQL, and Redis gates
        run: pnpm verify:module-app-production

  build:
    name: Build and Push Images
    needs: [verify-module-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.COMHUB_GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.COMHUB_GHCR_TOKEN || github.token }}

      - name: Report GHCR credential source
        shell: bash
        env:
          GHCR_USERNAME: ${{ vars.COMHUB_GHCR_USERNAME || github.repository_owner }}
          HAS_CUSTOM_GHCR_TOKEN: ${{ secrets.COMHUB_GHCR_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "GHCR username: ${GHCR_USERNAME}"
          echo "Using custom COMHUB_GHCR_TOKEN: ${HAS_CUSTOM_GHCR_TOKEN}"

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag || '' }}
        run: |
          set -euo pipefail

          sha_tag="sha-${GITHUB_SHA::12}"
          manual_tag="$MANUAL_IMAGE_TAG"
          if [ -n "$manual_tag" ] && [[ ! "$manual_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'image_tag must match [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}' >&2
            exit 1
          fi
          runtime_image_name="${IMAGE_NAME}-module-runtime"
          worker_image_name="${IMAGE_NAME}-module-worker"

          tags="${IMAGE_NAME}:${sha_tag}"
          runtime_tags="${runtime_image_name}:${sha_tag}"
          worker_tags="${worker_image_name}:${sha_tag}"
          if [ "${GITHUB_REF}" = 'refs/heads/main' ]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
            runtime_tags="${runtime_tags}"$'\n'"${runtime_image_name}:latest"
            worker_tags="${worker_tags}"$'\n'"${worker_image_name}:latest"
          fi
          if [ -n "${manual_tag}" ]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${manual_tag}"
            runtime_tags="${runtime_tags}"$'\n'"${runtime_image_name}:${manual_tag}"
            worker_tags="${worker_tags}"$'\n'"${worker_image_name}:${manual_tag}"
          fi

          {
            echo "image_tag=${sha_tag}"
            echo "image_ref=${IMAGE_NAME}:${sha_tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo 'EOF'
            echo "runtime_tags<<EOF"
            echo "${runtime_tags}"
            echo 'EOF'
            echo "worker_tags<<EOF"
            echo "${worker_tags}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve deterministic build metadata
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          echo "build_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            NODEJS_VERSION=${{ env.NODEJS_VERSION }}
            USE_CN_MIRROR=${{ github.event_name == 'workflow_dispatch' && inputs.use_cn_mirror == 'true' }}
            COMHUB_COMMIT_SHA=${{ github.sha }}
            COMHUB_BUILD_BRANCH=${{ github.ref_name }}
            COMHUB_BUILD_AT=${{ steps.build_meta.outputs.build_at }}
            COMHUB_IMAGE_TAG=${{ steps.image.outputs.image_tag }}
            COMHUB_IMAGE_REF=${{ steps.image.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Module App runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/module-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.runtime_tags }}
          cache-from: type=gha,scope=module-runtime
          cache-to: type=gha,mode=max,scope=module-runtime

      - name: Build and push Module App worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/module-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.worker_tags }}
          cache-from: type=gha,scope=module-worker
          cache-to: type=gha,mode=max,scope=module-worker
