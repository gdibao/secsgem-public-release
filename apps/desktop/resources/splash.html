<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>驰拓AI</title>
    <style>
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        -webkit-app-region: drag;
      }

      body {
        margin: 0;
        padding: 48px 0 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        color: #1f1f1f;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        body {
          color: #f5f5f5;
          background: #000;
        }
      }

      .container {
        text-align: center;
        user-select: none;
      }

      .brand-name {
        font-size: 32px;
        font-weight: 650;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <div class="drag-bar"></div>
    <main class="container" aria-label="驰拓AI">
      <div class="brand-name">驰拓AI</div>
    </main>
  </body>
</html>
