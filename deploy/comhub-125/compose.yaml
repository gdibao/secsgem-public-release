name: fab125

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  comhub:
    <<: *service
    image: ${COMHUB_IMAGE:?Set the verified immutable ComHub image}
    platform: linux/amd64
    init: true
    extra_hosts:
      - "fab.gdibao.com:${FAB_PUBLIC_IP:?Set the verified public ingress IP privately}"
    ports:
      - "127.0.0.1:3210:3210"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      APP_URL: https://fab.gdibao.com
      INTERNAL_APP_URL: http://127.0.0.1:3210
      MIDDLEWARE_REWRITE_THROUGH_LOCAL: "1"
      DATABASE_DRIVER: node
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Generate on .125}@postgresql:5432/comhub
      AUTH_SECRET: ${AUTH_SECRET:?Generate on .125}
      KEY_VAULTS_SECRET: ${KEY_VAULTS_SECRET:?Generate 32 random bytes as base64 on .125}
      JWKS_KEY: ${JWKS_KEY:?Generate private RSA JWKS on .125}
      AUTH_TRUSTED_ORIGINS: https://fab.gdibao.com
      AUTH_DISABLE_EMAIL_PASSWORD: ${AUTH_DISABLE_EMAIL_PASSWORD:-1}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_EMAIL_VERIFICATION: ${AUTH_EMAIL_VERIFICATION:-0}
      AUTH_ENABLE_MAGIC_LINK: "0"
      AUTH_SSO_PROVIDERS: ""
      REDIS_URL: redis://:${REDIS_PASSWORD:?Generate on .125}@redis:6379/0
      REDIS_PREFIX: fab125
      REDIS_TLS: "0"
      S3_ENDPOINT: https://fab.gdibao.com
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_BUCKET: comhub-files
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Generate on .125}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Generate on .125}
      S3_REGION: us-east-1
      S3_ENABLE_PATH_STYLE: "1"
      S3_SET_ACL: "0"
      S3_PUBLIC_DOMAIN: ""
      LLM_VISION_IMAGE_USE_BASE64: "1"
      CHUNKS_AUTO_EMBEDDING: "0"
      CHUNKS_AUTO_GEN_METADATA: "0"
      PROXY_URL: ${APP_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,::1,postgresql,redis,rustfs,comhub
      no_proxy: localhost,127.0.0.1,::1,postgresql,redis,rustfs,comhub
      ENABLE_PROXY_DNS: "0"
      MODULE_APP_EXECUTION_ENABLED: "false"
      MODULE_APP_RUNTIME_INVOCATION_ENABLED: "false"
      MODULE_APP_WORKFLOW_PRIVILEGED_EXECUTORS_ENABLED: "false"
      MODULE_APP_SCHEDULE_DISPATCH_ENABLED: "false"
      MODULE_APP_PUBLIC_EXECUTION_ENABLED: "false"
      MODULE_APP_ALIPAY_ENABLED: "false"
      MODULE_APP_ALIPAY_PAYMENT_CREATION_ENABLED: "false"
      MODULE_APP_ALIPAY_AUTO_SETTLEMENT_ENABLED: "false"
      MODULE_APP_PUBLISHER_PAYOUT_RECORDING_ENABLED: "false"
      MODULE_APP_RUNTIME_APP_ALLOWLIST: ""
      MODULE_APP_PUBLISHER_ALLOWLIST: ""
    volumes:
      - ./ops:/ops:ro
    healthcheck:
      test: [CMD, /bin/node, -e, "require('http').get('http://127.0.0.1:3210/api/version',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 180s
      retries: 12

  postgresql:
    <<: *service
    image: paradedb/paradedb@sha256:0606ed798dd5ecda1ddec002f36dd807c3342b269b57ce14cad7eb2033bbb344
    platform: linux/amd64
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: comhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate on .125}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d comhub"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    <<: *service
    image: redis@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    platform: linux/amd64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Generate on .125}
    command: [/bin/sh, -ec, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 30

  rustfs:
    <<: *service
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    platform: linux/amd64
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Generate on .125}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Generate on .125}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CORS_ALLOWED_ORIGINS: https://fab.gdibao.com
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 5s
      timeout: 5s
      retries: 30

  # Inactive fallback only. Requires certificate renewal delivery and removal
  # of comhub's public-IP extra_hosts override before any local-TLS deployment.
  storage-tls:
    <<: *service
    profiles: [local-tls]
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    platform: linux/amd64
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.tls:/etc/nginx/tls:ro
    networks:
      default:
        aliases:
          - fab.gdibao.com
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  rustfs-logs:
