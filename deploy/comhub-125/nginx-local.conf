map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    location = /health { return 200 'ok'; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name fab.gdibao.com;
    ssl_certificate /etc/nginx/tls/fab.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/fab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 ipv6=off valid=30s;
    client_max_body_size 100m;
    # Do not log presigned URL query strings or their signature credentials.
    access_log off;

    location ~ ^/comhub-files(?:/|$) {
        set $s3_backend http://rustfs:9000;
        proxy_pass $s3_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        set $app_backend http://comhub:3210;
        proxy_pass $app_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
